services:
  bd:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # Se cargan en orden alfabético la primera vez que el volumen está
      # vacío: crean las tablas y completan el catálogo de colores/razas.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/catalogos.sql:/docker-entrypoint-initdb.d/02-catalogos.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: bd
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      RUTA_IMAGENES: /imagenes
    volumes:
      - imagenes:/imagenes
    depends_on:
      bd:
        condition: service_healthy

  funcional:
    build: ./funcional
    environment:
      BACKEND_URL: http://backend:8000
      TZ: ${TZ:-America/Monterrey}
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80" # para probar en local: http://localhost:8080
    depends_on:
      - backend
      - funcional

  tunel:
    image: cloudflare/cloudflared:latest
    # Quick tunnel: no necesita cuenta de Cloudflare, pero la URL pública
    # cambia cada vez que el contenedor se reinicia (ver README y C.13).
    # La URL aparece en: docker compose logs tunel | grep trycloudflare
    command: tunnel --no-autoupdate --url http://proxy:80
    depends_on:
      - proxy

  # Servicio de herramientas: no se levanta con "docker compose up" (vive
  # tras el perfil "herramientas"); sólo sirve para correr comandos de mix
  # sin instalar Elixir en la máquina. Uso:
  #   docker compose run --rm herramientas mix test
  #   docker compose run --rm herramientas mix deps.get
  herramientas:
    image: elixir:1.18-alpine
    profiles: ["herramientas"]
    working_dir: /app
    volumes:
      - ./funcional:/app
      - mix_cache:/root/.mix
      - hex_cache:/root/.hex

volumes:
  db_data:
  imagenes:
  mix_cache:
  hex_cache:
