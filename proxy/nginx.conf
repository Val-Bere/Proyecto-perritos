# Única puerta de entrada. El túnel de Cloudflare apunta aquí y este
# proxy reparte por ruta. Por eso el frontend y el servicio Elixir se
# llaman entre sí con rutas relativas (nunca con http://localhost:...).
server {
    listen 80;
    client_max_body_size 10m;      # las fotos de los perritos

    # El backend del P1 sirve el frontend (index.html) Y su propia API
    # en la raíz (así quedó armado en el P1: no usa prefijo /api).
    location / {
        proxy_pass http://backend:8000;
    }

    # El servicio Elixir del P2. Se conserva el prefijo /f porque sus
    # rutas, dentro de Perritos.Router, ya se declaran como "/f/...".
    location /f/ {
        proxy_pass http://funcional:4000;
    }
}
