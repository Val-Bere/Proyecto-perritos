<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐾 Registro de Perritos de la Calle</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS para el Mapa -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />

    <style>
        :root {
            --primary: #7c3aed;
            --primary-hover: #6d28d9;
            --primary-light: #f5f3ff;
            --accent: #a78bfa;
            --bg-color: #faf5ff;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e9d5ff;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container { max-width: 850px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 25px; }
        header h1 { color: var(--primary); font-size: 2.2rem; font-weight: 700; margin-bottom: 8px; }
        header p { color: var(--text-muted); font-size: 1rem; }

        /* Navegación por pestañas (sin recargar la página) */
        nav.tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0 30px;
            flex-wrap: wrap;
        }

        nav.tabs button {
            font-family: inherit;
            border: none;
            cursor: pointer;
            text-decoration: none;
            color: var(--primary);
            background: var(--primary-light);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        nav.tabs button.activo { background: var(--primary); color: white; }

        /* Cada "vista" es una sección que se muestra u oculta */
        .vista { display: none; }
        .vista.visible { display: block; }

        .card-form {
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.08), 0 8px 10px -6px rgba(124, 58, 237, 0.08);
            border: 1px solid var(--border-color);
            margin-bottom: 40px;
        }

        .form-section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary-light);
        }

        .form-group { margin-bottom: 22px; }

        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.95rem; }

        input[type="text"], select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            background-color: #fff;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        select.campo-invalido, input.campo-invalido { border-color: #f87171 !important; }

        .file-upload-box {
            border: 2px dashed var(--accent);
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            background-color: var(--primary-light);
            cursor: pointer;
            transition: background 0.3s;
        }

        .file-upload-box:hover { background-color: #ede9fe; }

        input[type="file"] { margin-top: 10px; }

        #mapRegistro, #mapGeneral {
            width: 100%;
            height: 320px;
            border-radius: 12px;
            margin-top: 10px;
            border: 2px solid var(--border-color);
        }

        #mapGeneral { height: 480px; }

        .map-actions {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .btn-ubicacion {
            background: #ede9fe;
            color: var(--primary);
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-ubicacion:hover { background: #ddd6fe; }

        button[type="submit"] {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2);
        }

        button[type="submit"]:hover { background-color: var(--primary-hover); }
        button[type="submit"]:active { transform: scale(0.99); }

        .error-box {
            background-color: #fef2f2;
            border: 2px solid #fecaca;
            color: #b91c1c;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .error-box ul { margin: 6px 0 0 20px; font-weight: 500; }

        .success-box {
            background-color: #f0fdf4;
            border: 2px solid #bbf7d0;
            color: #15803d;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* Vista: card genérica (mapa/lista) */
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.08);
            border: 1px solid var(--border-color);
        }

        /* Vista: lista */
        .lista { display: flex; flex-direction: column; gap: 14px; }

        .item {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 14px;
            cursor: pointer;
            transition: box-shadow 0.2s;
        }
        .item:hover { box-shadow: 0 6px 16px rgba(124, 58, 237, 0.12); }

        .item img {
            width: 72px; height: 72px;
            object-fit: cover;
            border-radius: 12px;
            flex-shrink: 0;
            background: var(--primary-light);
        }

        .item-info h3 { font-size: 1.05rem; margin-bottom: 4px; }
        .item-info p { font-size: 0.85rem; color: var(--text-muted); }

        /* Vista: detalle */
        .detalle-card { overflow: hidden; padding: 0; }
        .detalle-card img {
            width: 100%; height: 280px;
            object-fit: cover;
            background: var(--primary-light);
        }
        .detalle-body { padding: 26px; }
        .detalle-body h1 { color: var(--primary); font-size: 1.6rem; margin-bottom: 6px; }
        .detalle-body .fecha { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 18px; }
        .dato { margin-bottom: 14px; }
        .dato span.etiqueta { display: block; font-size: 0.8rem; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
        .dato span.valor { font-size: 1rem; }
        .btn-volver {
            display: inline-block;
            margin-bottom: 16px;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            background: none;
            border: none;
            font-family: inherit;
        }

        .estado { text-align: center; color: var(--text-muted); padding: 30px; }

        /* Popup del pin en el mapa general */
        .popup-perrito { font-family: 'Plus Jakarta Sans', sans-serif; text-align: center; }
        .popup-perrito img { width: 140px; height: 100px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
        .popup-perrito h3 { color: var(--primary); font-size: 1rem; margin-bottom: 4px; }
        .popup-perrito p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
        .popup-perrito button {
            background: var(--primary); color: white; border: none;
            padding: 6px 14px; border-radius: 8px; font-size: 0.85rem;
            font-weight: 600; cursor: pointer; font-family: inherit;
        }
    </style>
</head>
<body>

    <header>
        <h1>🐾 Adopta y Rescata: Perritos de la Calle</h1>
        <p>Sistema oficial de registro y control ciudadano</p>
        <nav class="tabs">
            <button data-vista="registro" class="activo">Registrar</button>
            <button data-vista="mapa">Mapa</button>
            <button data-vista="lista">Lista</button>
        </nav>
    </header>

    <div class="container">

        <!-- ============ VISTA: REGISTRO ============ -->
        <section id="vista-registro" class="vista visible">
            <div class="card-form">
                <form id="formPerrito" novalidate>
                    <div class="form-section-title">1. Identificación y Fotografía</div>

                    <div class="form-group">
                        <label for="nombre">Nombre o seña particular:</label>
                        <input type="text" id="nombre" placeholder="Ej. Lomito café / Manchas">
                    </div>

                    <div class="form-group">
                        <label for="foto">Fotografía (Cámara o archivo - JPG, PNG, WEBP):</label>
                        <div class="file-upload-box">
                            <input type="file" id="foto" accept="image/png, image/jpeg, image/webp">
                        </div>
                    </div>

                    <div class="form-section-title">2. Características Físicas</div>

                    <div class="form-group">
                        <label for="id_raza">Raza (opcional):</label>
                        <select id="id_raza">
                            <option value="" disabled selected>Cargando razas desde el servidor...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="id_color_principal">Color Principal:</label>
                        <select id="id_color_principal">
                            <option value="" disabled selected>Cargando colores desde el servidor...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="id_color_adicional_1">Color Adicional 1 (Opcional):</label>
                        <select id="id_color_adicional_1"><option value="">Ninguno</option></select>
                    </div>

                    <div class="form-group">
                        <label for="id_color_adicional_2">Color Adicional 2 (Opcional):</label>
                        <select id="id_color_adicional_2"><option value="">Ninguno</option></select>
                    </div>

                    <div class="form-section-title">3. Ubicación del Avistamiento</div>
                    <div class="form-group">
                        <label>Mueve el pin en el mapa donde viste al perrito:</label>
                        <div id="mapRegistro"></div>
                        <div class="map-actions">
                            <span id="coordInfo">Lat: 25.4237, Lng: -101.0053</span>
                            <button type="button" class="btn-ubicacion" id="btnMiUbicacion">📍 Usar mi ubicación actual</button>
                        </div>
                    </div>

                    <div id="errorBox" class="error-box" style="display:none;"></div>
                    <div id="successBox" class="success-box" style="display:none;"></div>

                    <button type="submit">Registrar Perrito en el Sistema</button>
                </form>
            </div>
        </section>

        <!-- ============ VISTA: MAPA GENERAL ============ -->
        <section id="vista-mapa" class="vista">
            <div class="card">
                <div id="mapGeneral"></div>
                <p id="estadoMapa" class="estado" style="display:none;"></p>
            </div>
        </section>

        <!-- ============ VISTA: LISTA ============ -->
        <section id="vista-lista" class="vista">
            <div id="lista" class="lista"></div>
            <p id="estadoLista" class="estado" style="display:none;"></p>
        </section>

        <!-- ============ VISTA: DETALLE ============ -->
        <section id="vista-detalle" class="vista">
            <button class="btn-volver" id="btnVolver">← Volver</button>
            <div id="detalleContenido"></div>
            <p id="estadoDetalle" class="estado" style="display:none;"></p>
        </section>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        // URL base del backend. Ajustar en producción (ver sección Despliegue del README).
        const API_BASE = '';

        // ======================================================
        // 1. NAVEGACIÓN ENTRE VISTAS (sin recargar la página)
        // ======================================================
        let vistaAnterior = 'registro'; // a dónde regresa el botón "Volver" del detalle

        function mostrarVista(nombre) {
            document.querySelectorAll('.vista').forEach(v => v.classList.remove('visible'));
            document.getElementById('vista-' + nombre).classList.add('visible');

            document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('activo'));
            const botonTab = document.querySelector(`nav.tabs button[data-vista="${nombre}"]`);
            if (botonTab) botonTab.classList.add('activo');

            // Acciones al entrar a cada vista
            if (nombre === 'mapa') {
                setTimeout(() => mapGeneral.invalidateSize(), 50); // Leaflet necesita esto si estaba oculto
                cargarPerritosMapa();
            }
            if (nombre === 'lista') {
                cargarLista();
            }
            if (nombre === 'registro') {
                setTimeout(() => mapRegistro.invalidateSize(), 50);
            }
            if (nombre !== 'detalle') {
                vistaAnterior = nombre;
            }
        }

        document.querySelectorAll('nav.tabs button').forEach(btn => {
            btn.addEventListener('click', () => mostrarVista(btn.dataset.vista));
        });

        document.getElementById('btnVolver').addEventListener('click', () => mostrarVista(vistaAnterior));

        function verDetalle(id) {
            mostrarVista('detalle');
            cargarDetalle(id);
        }

        // ======================================================
        // 2. MAPA DEL FORMULARIO DE REGISTRO
        // ======================================================
        const mapRegistro = L.map('mapRegistro').setView([25.4237, -101.0053], 13);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles © Esri'
        }).addTo(mapRegistro);

        let marker = L.marker([25.4237, -101.0053], { draggable: true }).addTo(mapRegistro);
        let latActual = 25.4237;
        let lngActual = -101.0053;

        // Clave de idempotencia: se genera UNA sola vez al cargar el formulario.
        // Si el usuario da doble clic en "Enviar", o el celular reintenta por mala
        // señal, ambos envíos llevan la misma clave y el backend debe responder
        // con el mismo registro en vez de crear uno duplicado.
        const claveIdempotencia = crypto.randomUUID();

        function actualizarCoordenadas(lat, lng) {
            latActual = lat;
            lngActual = lng;
            document.getElementById('coordInfo').innerText = `Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;
        }

        marker.on('dragend', () => {
            const position = marker.getLatLng();
            actualizarCoordenadas(position.lat, position.lng);
        });

        document.getElementById('btnMiUbicacion').addEventListener('click', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    mapRegistro.setView([lat, lng], 16);
                    marker.setLatLng([lat, lng]);
                    actualizarCoordenadas(lat, lng);
                }, () => alert('No se pudo obtener tu ubicación.'));
            }
        });

        // ======================================================
        // 3. CATÁLOGOS DE RAZAS Y COLORES
        // ======================================================
        async function cargarCatalogos() {
            try {
                const resRazas = await fetch(`${API_BASE}/catalogos/razas`);
                const razas = await resRazas.json();
                const selectRaza = document.getElementById('id_raza');
                selectRaza.innerHTML = '<option value="" disabled selected>Selecciona una raza</option>';
                razas.forEach(r => {
                    selectRaza.innerHTML += `<option value="${r.id}">${r.nombre}</option>`;
                });
            } catch (error) {
                console.warn('Backend de razas no disponible aún, usando respaldo local.');
                document.getElementById('id_raza').innerHTML = '<option value="1">Sin raza definida / criollo</option>';
            }

            try {
                const resColores = await fetch(`${API_BASE}/catalogos/colores`);
                const colores = await resColores.json();

                const selectColorPrin = document.getElementById('id_color_principal');
                const selectColorAd1 = document.getElementById('id_color_adicional_1');
                const selectColorAd2 = document.getElementById('id_color_adicional_2');

                selectColorPrin.innerHTML = '<option value="" disabled selected>Selecciona un color principal</option>';

                colores.forEach(c => {
                    const opt = `<option value="${c.id}">${c.nombre}</option>`;
                    selectColorPrin.innerHTML += opt;
                    selectColorAd1.innerHTML += opt;
                    selectColorAd2.innerHTML += opt;
                });
            } catch (error) {
                console.warn('Backend de colores no disponible aún, usando respaldo local.');
                document.getElementById('id_color_principal').innerHTML =
                    '<option value="" disabled selected>Selecciona un color principal</option><option value="1">Café</option>';
            }
        }

        cargarCatalogos();

        // ======================================================
        // 4. VALIDACIÓN Y ENVÍO DEL FORMULARIO
        // ======================================================
        function limpiarErroresVisuales() {
            document.querySelectorAll('.campo-invalido').forEach(el => el.classList.remove('campo-invalido'));
        }

        function marcarInvalido(id) {
            const el = document.getElementById(id);
            if (el) el.classList.add('campo-invalido');
        }

        function validarFormulario() {
            const errores = [];
            limpiarErroresVisuales();

            const nombre = document.getElementById('nombre').value;
            if (nombre.trim() === '') {
                errores.push('Falta el nombre o seña particular del perrito.');
                marcarInvalido('nombre');
            }

            const fotoInput = document.getElementById('foto').files[0];
            if (!fotoInput) {
                errores.push('Falta la foto del perrito.');
                marcarInvalido('foto');
            }

            const colorPrincipal = document.getElementById('id_color_principal').value;
            if (!colorPrincipal) {
                errores.push('Falta elegir el color principal.');
                marcarInvalido('id_color_principal');
            }

            const colAd1 = document.getElementById('id_color_adicional_1').value;
            const colAd2 = document.getElementById('id_color_adicional_2').value;

            // No se puede repetir el color principal ni repetir un color adicional.
            const coloresElegidos = [colorPrincipal, colAd1, colAd2].filter(c => c !== '');
            const coloresUnicos = new Set(coloresElegidos);
            if (coloresUnicos.size !== coloresElegidos.length) {
                errores.push('No puedes repetir un color: elige colores distintos para principal y adicionales.');
                marcarInvalido('id_color_adicional_1');
                marcarInvalido('id_color_adicional_2');
            }

            return errores;
        }

        function mostrarErrores(errores) {
            const errorBox = document.getElementById('errorBox');
            const successBox = document.getElementById('successBox');
            successBox.style.display = 'none';

            if (errores.length === 0) {
                errorBox.style.display = 'none';
                errorBox.innerHTML = '';
                return;
            }

            errorBox.innerHTML = 'Revisa lo siguiente antes de continuar:<ul>' +
                errores.map(msg => `<li>${msg}</li>`).join('') + '</ul>';
            errorBox.style.display = 'block';
            errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        document.getElementById('formPerrito').addEventListener('submit', async (e) => {
            e.preventDefault();

            const errores = validarFormulario();
            mostrarErrores(errores);
            if (errores.length > 0) return;

            const formData = new FormData();
            formData.append('nombre', document.getElementById('nombre').value.trim());
            formData.append('id_raza', document.getElementById('id_raza').value || '');
            formData.append('color_principal_id', document.getElementById('id_color_principal').value);

            // Colores adicionales: un solo campo de texto con los ids separados por coma.
            const colAd1 = document.getElementById('id_color_adicional_1').value;
            const colAd2 = document.getElementById('id_color_adicional_2').value;
            const adicionales = [colAd1, colAd2].filter(c => c !== '');
            formData.append('colores_adicionales', adicionales.join(','));

            formData.append('latitud', latActual);
            formData.append('longitud', lngActual);
            formData.append('clave_idempotencia', claveIdempotencia);
            formData.append('foto', document.getElementById('foto').files[0]);

            const successBox = document.getElementById('successBox');
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/perritos/`, { method: 'POST', body: formData });
                if (response.ok) {
                    successBox.textContent = '¡Perrito registrado con éxito!';
                    successBox.style.display = 'block';

                    // El perrito nuevo ya se guardó en el backend, pero la Lista y el
                    // Mapa general tienen su propia copia en memoria para no pedirla
                    // de más. Hay que invalidarla para que la próxima vez que se
                    // visiten esas pestañas, vuelvan a pedir los datos actualizados.
                    listaCargada = false;
                    document.getElementById('lista').innerHTML = '';
                    document.getElementById('estadoLista').style.display = 'none';

                    mapGeneralCargado = false;
                    mapGeneral.eachLayer(capa => {
                        if (capa instanceof L.Marker) mapGeneral.removeLayer(capa);
                    });
                    document.getElementById('estadoMapa').style.display = 'none';
                } else {
                    mostrarErrores(['No se pudo registrar al perrito. Intenta de nuevo en unos segundos.']);
                }
            } catch (err) {
                console.error(err);
                mostrarErrores(['No se pudo conectar con el servidor. Verifica tu conexión e intenta de nuevo.']);
            }
        });

        // ======================================================
        // 5. MAPA GENERAL (todos los perritos)
        // ======================================================
        const mapGeneral = L.map('mapGeneral').setView([25.4237, -101.0053], 12);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles © Esri'
        }).addTo(mapGeneral);

        let mapGeneralCargado = false;

        function popupPerrito(p) {
            const fotoUrl = `${API_BASE}/perritos/imagenes/${p.foto_archivo}`;
            const colorPrincipal = p.colores?.find(c => c.es_principal)?.nombre;
            const div = document.createElement('div');
            div.className = 'popup-perrito';
            div.innerHTML = `
                <img src="${fotoUrl}" alt="${p.nombre}">
                <h3>${p.nombre}</h3>
                <p>${colorPrincipal || 'Color sin especificar'}</p>
                <button>Ver detalle</button>
            `;
            div.querySelector('button').addEventListener('click', () => verDetalle(p.id));
            return div;
        }

        async function cargarPerritosMapa() {
            if (mapGeneralCargado) return; // evita recargar cada vez que se cambia de pestaña
            const estado = document.getElementById('estadoMapa');
            try {
                const res = await fetch(`${API_BASE}/perritos/`);
                if (!res.ok) throw new Error('Respuesta no válida del servidor');
                const perritos = await res.json();
                mapGeneralCargado = true;

                if (perritos.length === 0) {
                    estado.textContent = 'Todavía no hay perritos registrados. ¡Sé el primero en registrar uno!';
                    estado.style.display = 'block';
                    return;
                }

                const puntos = [];
                perritos.forEach(p => {
                    if (p.latitud == null || p.longitud == null) return;
                    const marker = L.marker([p.latitud, p.longitud]).addTo(mapGeneral);
                    marker.bindPopup(popupPerrito(p));
                    puntos.push([p.latitud, p.longitud]);
                });

                if (puntos.length > 0) mapGeneral.fitBounds(puntos, { padding: [30, 30] });
            } catch (error) {
                console.warn('No se pudo cargar la lista de perritos:', error);
                estado.textContent = 'No se pudo conectar con el servidor. Intenta de nuevo más tarde.';
                estado.style.display = 'block';
            }
        }

        // ======================================================
        // 6. LISTA
        // ======================================================
        let listaCargada = false;

        function itemPerrito(p) {
            const fotoUrl = `${API_BASE}/perritos/imagenes/${p.foto_archivo}`;
            const colorPrincipal = p.colores?.find(c => c.es_principal)?.nombre;
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `
                <img src="${fotoUrl}" alt="${p.nombre}">
                <div class="item-info">
                    <h3>${p.nombre}</h3>
                    <p>${colorPrincipal || 'Color sin especificar'}${p.raza_nombre ? ' · ' + p.raza_nombre : ''}</p>
                </div>
            `;
            div.addEventListener('click', () => verDetalle(p.id));
            return div;
        }

        async function cargarLista() {
            if (listaCargada) return;
            const contenedor = document.getElementById('lista');
            const estado = document.getElementById('estadoLista');
            try {
                const res = await fetch(`${API_BASE}/perritos/`);
                if (!res.ok) throw new Error('Respuesta no válida del servidor');
                const perritos = await res.json();
                listaCargada = true;

                if (perritos.length === 0) {
                    estado.textContent = 'Todavía no hay perritos registrados.';
                    estado.style.display = 'block';
                    return;
                }

                perritos.forEach(p => contenedor.appendChild(itemPerrito(p)));
            } catch (error) {
                console.warn('No se pudo cargar la lista de perritos:', error);
                estado.textContent = 'No se pudo conectar con el servidor. Intenta de nuevo más tarde.';
                estado.style.display = 'block';
            }
        }

        // ======================================================
        // 7. DETALLE
        // ======================================================
        async function cargarDetalle(id) {
            const contenedor = document.getElementById('detalleContenido');
            const estado = document.getElementById('estadoDetalle');
            contenedor.innerHTML = '';
            estado.style.display = 'none';

            try {
                const res = await fetch(`${API_BASE}/perritos/${id}`);
                if (!res.ok) throw new Error('Perrito no encontrado');
                const p = await res.json();

                const fotoUrl = `${API_BASE}/perritos/imagenes/${p.foto_archivo}`;
                const colorPrincipal = p.colores?.find(c => c.es_principal)?.nombre;
                const coloresAdicionales = p.colores?.filter(c => !c.es_principal).map(c => c.nombre) || [];
                const colores = [colorPrincipal, ...coloresAdicionales].filter(Boolean).join(', ');

                contenedor.innerHTML = `
                    <div class="card detalle-card">
                        <img src="${fotoUrl}" alt="${p.nombre}">
                        <div class="detalle-body">
                            <h1>${p.nombre}</h1>
                            <p class="fecha">Registrado el ${p.fecha_registro || 'fecha no disponible'}</p>
                            <div class="dato">
                                <span class="etiqueta">Raza</span>
                                <span class="valor">${p.raza_nombre || 'Sin raza definida / criollo'}</span>
                            </div>
                            <div class="dato">
                                <span class="etiqueta">Colores</span>
                                <span class="valor">${colores || 'No especificado'}</span>
                            </div>
                            <div class="dato">
                                <span class="etiqueta">Ubicación</span>
                                <span class="valor">Lat ${p.latitud}, Lng ${p.longitud}</span>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.warn('No se pudo cargar el detalle del perrito:', error);
                estado.textContent = 'No se pudo encontrar este registro. Puede que ya no exista.';
                estado.style.display = 'block';
            }
        }
    </script>
</body>
</html>
